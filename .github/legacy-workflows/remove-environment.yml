name: Remove Environment

on:
  pull_request:
    types: [closed]

jobs:
  # `secrets` cannot be referenced directly in `if:` (GitHub Actions rejects it
  # as an unrecognized named-value there), so resolve it into a job output here
  # and have Remove-Preview-Environment gate on that instead.
  check-preview-secret:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: echo "configured=${{ secrets.PREVIEW_SSH_KEY != '' }}" >> "$GITHUB_OUTPUT"

  Remove-Preview-Environment:
    runs-on: ubuntu-latest
    needs: check-preview-secret
    # Tears down preview environments on Activepieces' pre-prod server over SSH.
    # This fork has no PREVIEW_* secrets, so the job stays disabled (gated on
    # secret presence rather than a repo check) until preview infra is configured.
    if: needs.check-preview-secret.outputs.configured == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      NX_NO_CLOUD: true 
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/preview-server.key
          chmod 600 ~/.ssh/preview-server.key
          cat >>~/.ssh/config <<END
          Host preview-server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/preview-server.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.PRE_PROD_USERNAME }}
          SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          SSH_HOST: ${{ secrets.PREVIEW_HOST }}

      - name: Remove Environment
        run: |
          ssh preview-server -t -t 'bash -ic "cd /root/environments && npm run build && node dist/index.js remove ${{ github.head_ref }}; exit"'
