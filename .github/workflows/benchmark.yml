name: Benchmark

on:
  pull_request:
    paths:
      - 'benchmark/gate/**'
      - 'benchmark/baselines/**'
      - '.github/workflows/benchmark.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario to run (execute-text-helper | connections-list)'
        required: false
        default: 'execute-text-helper'
      record_baseline:
        description: 'Also emit a proposed baseline artifact to commit in a reviewed PR'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  gate-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Unit tests
        run: node --test "benchmark/gate/test/*.test.mjs"

      - name: Injected-slowdown self-test
        run: node benchmark/gate/cli.mjs selftest

  regression-gate:
    if: github.event_name != 'pull_request'
    needs: gate-selftest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: benchmark
    env:
      SCENARIO: ${{ inputs.scenario || 'execute-text-helper' }}
      TIER: nightly
      BENCH_ENVIRONMENT: ${{ vars.BENCH_ENVIRONMENT || 'benchmark' }}
      BENCH_IMAGE: ${{ vars.BENCH_IMAGE }}
      BENCH_BASE_URL: ${{ vars.BENCH_BASE_URL }}
      BENCH_PROJECT_ID: ${{ vars.BENCH_PROJECT_ID }}
      BENCH_CONNECTION_ID: ${{ vars.BENCH_CONNECTION_ID }}
      BENCH_API_KEY: ${{ secrets.BENCH_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check benchmark target is configured
        id: target
        run: |
          if [ -n "$BENCH_BASE_URL" ] && [ -n "$BENCH_API_KEY" ] && [ -n "$BENCH_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Performance gate skipped: set BENCH_BASE_URL, BENCH_PROJECT_ID, BENCH_CONNECTION_ID vars and BENCH_API_KEY secret on the 'benchmark' environment (see benchmark/gate/README.md)."
            echo "Performance gate skipped: benchmark target not configured. See \`benchmark/gate/README.md\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run benchmark
        if: steps.target.outputs.configured == 'true'
        run: |
          BASELINE="benchmark/baselines/${SCENARIO}.${TIER}.json"
          test -f "$BASELINE" || { echo "::error::No baseline file $BASELINE"; exit 2; }
          node benchmark/gate/cli.mjs run \
            --scenario "$SCENARIO" --tier "$TIER" --out results.json \
            --concurrency "$(jq -r .shape.concurrency "$BASELINE")" \
            --requests "$(jq -r .shape.requestsPerRound "$BASELINE")" \
            --rounds "$(jq -r .shape.rounds "$BASELINE")" \
            --workers "$(jq -r .shape.workers "$BASELINE")" \
            --apps "$(jq -r .shape.apps "$BASELINE")"

      - name: Compare against baseline
        id: compare
        if: steps.target.outputs.configured == 'true'
        run: |
          set +e
          node benchmark/gate/cli.mjs compare \
            --baseline "benchmark/baselines/${SCENARIO}.${TIER}.json" \
            --results results.json --summary summary.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Propose baseline
        if: steps.target.outputs.configured == 'true' && inputs.record_baseline
        run: |
          cp "benchmark/baselines/${SCENARIO}.${TIER}.json" proposed-baseline.json
          node benchmark/gate/cli.mjs promote --results results.json --baseline proposed-baseline.json

      - name: Upload results
        if: always() && steps.target.outputs.configured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ env.SCENARIO }}-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: ignore
          path: |
            results.json
            summary.md
            proposed-baseline.json

      - name: Enforce gate
        if: steps.target.outputs.configured == 'true'
        run: exit "${{ steps.compare.outputs.exit_code }}"
