name: Release Connect SDK

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: connect-sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Mihir-Rabari/inboxfm-connect'
    runs-on: ubuntu-latest
    environment: sdk-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Validate immutable release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/connect-sdk/package.json').version")
          test "${GITHUB_REF_NAME}" = "sdk-v${VERSION}"
          git fetch origin dev
          git merge-base --is-ancestor HEAD origin/dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check generated contracts and types
        run: |
          npx turbo run typecheck --filter=@inboxfm-connect/sdk
          npx turbo run generate:check --filter=@inboxfm-connect/sdk

      - name: Verify release tarball
        env:
          CONNECT_SDK_SMOKE_BASE_URL: ${{ vars.CONNECT_SDK_SMOKE_BASE_URL }}
          CONNECT_SDK_SMOKE_API_KEY: ${{ secrets.CONNECT_SDK_SMOKE_API_KEY }}
          CONNECT_SDK_SMOKE_PROJECT_ID: ${{ vars.CONNECT_SDK_SMOKE_PROJECT_ID }}
          CONNECT_SDK_SMOKE_CONNECTION_ID: ${{ vars.CONNECT_SDK_SMOKE_CONNECTION_ID }}
        run: |
          test -n "$CONNECT_SDK_SMOKE_BASE_URL"
          test -n "$CONNECT_SDK_SMOKE_API_KEY"
          test -n "$CONNECT_SDK_SMOKE_PROJECT_ID"
          test -n "$CONNECT_SDK_SMOKE_CONNECTION_ID"
          npm run pack:verify --workspace=@inboxfm-connect/sdk

      - name: Check npm release state
        id: registry
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/connect-sdk/package.json').version")
          if npm view "@inboxfm-connect/sdk@${VERSION}" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with npm trusted publishing and provenance
        if: github.event_name == 'push' && steps.registry.outputs.published == 'false'
        working-directory: packages/connect-sdk
        run: npm publish --provenance --access public
