name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  TURBO_TELEMETRY_DISABLED: '1'
  # Redis 8's bundled modules require Rust; these tests use plain Redis.
  REDISMS_VERSION: '7.4.0'
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'origin/dev' }}

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR destination
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$PR_BASE" == dev ]]; then exit 0; fi
          if [[ "$PR_BASE" == main && "$PR_HEAD" == dev && "$PR_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then exit 0; fi
          echo '::error::Contributions must target dev. Only the repository dev branch may be promoted to main.'
          exit 1
      - name: Validate workflow syntax
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.12 -color -shellcheck=
      - uses: ./.github/actions/setup-ci
      - name: Check licensing boundaries, notices and N+1 queries
        run: |
          node --test tools/ci/*.test.mjs
          npm run test-tools
          node tools/ci/check-license-boundaries.mjs
          node tools/ci/check-n-plus-one.mjs
      - name: Verify benchmark regression gate
        run: |
          npm run test-bench-gate
          node benchmark/gate/cli.mjs selftest

  checks:
    name: Checks (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suite: [quality, unit, engine-integration, ce, ee, cloud, migrations, integrations]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Run checks
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -o pipefail
          node tools/ci/run-check.mjs "$SUITE" 2>&1 | tee ci.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.suite }}-diagnostics
          path: |
            ci.log
            packages/core/shared/coverage
            packages/core/execution/coverage
            packages/engine/coverage
            packages/connect-sdk/coverage
            packages/web/coverage
            packages/server/api/coverage
            packages/server/api/junit.xml
          retention-days: 7
          if-no-files-found: warn

  tool-search-postgres:
    name: tool-search (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inboxfm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      AP_EDITION: ce
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: localhost
      AP_POSTGRES_PORT: '5432'
      AP_POSTGRES_DATABASE: inboxfm_test
      AP_POSTGRES_USERNAME: postgres
      AP_POSTGRES_PASSWORD: postgres
      AP_POSTGRES_USE_SSL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Enable pgvector for integration tests
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d inboxfm_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - name: Build API
        run: bun x turbo run build --filter=api
      - name: Run PostgreSQL driver tests
        working-directory: packages/server/api
        run: |
          set -o pipefail
          bun x vitest run test/integration/ce/tool-search test/integration/ce/database --bail 1 --passWithNoTests=false 2>&1 | tee postgres-tests.log
      - name: Upload PostgreSQL diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-diagnostics
          path: packages/server/api/postgres-tests.log
          retention-days: 7
          if-no-files-found: warn

  browser:
    name: Browser journey (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Install browser engines and system dependencies
        run: bun x playwright install --with-deps chromium firefox webkit
      - name: Validate browser test sources
        run: |
          bun x eslint packages/tests-e2e --ext .ts
          bun x tsc -p packages/tests-e2e/tsconfig.json
      - name: Run real browser journey against the local platform
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee browser-tests.log
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics
          path: |
            browser-tests.log
            packages/tests-e2e/playwright-report
            packages/tests-e2e/test-results
          retention-days: 7
          if-no-files-found: warn

  gateway:
    name: Inbound gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate shipped nginx configuration
        run: |
          # `nginx -t` resolves upstream server names, so run it on a throwaway
          # network that answers for the `app` hostname.
          docker network create gateway-config-check
          docker run -d --name app --network gateway-config-check nginx:1.30.5-alpine sleep 600
          trap 'docker rm -f app >/dev/null 2>&1 || true; docker network rm gateway-config-check >/dev/null 2>&1 || true' EXIT
          docker run --rm --network gateway-config-check \
            -v "$GITHUB_WORKSPACE/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.30.5-alpine nginx -t
      - name: Validate compose topology
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
      - name: Cleanup
        if: always()
        run: |
          docker rm -f app >/dev/null 2>&1 || true
          docker network rm gateway-config-check >/dev/null 2>&1 || true

  main:
    name: main
    if: always()
    needs: [policy, checks, tool-search-postgres, browser, gateway]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); const failed = Object.entries(jobs).filter(([, job]) => job.result !== "success"); if (failed.length) { console.error(failed.map(([name, job]) => name + ": " + job.result).join("\n")); process.exit(1); } console.log("All CI checks passed.");'
