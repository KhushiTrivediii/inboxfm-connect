name: Smoke Test

on:
  workflow_dispatch:
  workflow_call:

jobs:
  smoke-test:
    concurrency:
      group: smoke-test-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
      # /v1/execute runs piece actions in an engine child of the APP process. 256 MB leaves
      # ordinary executes plenty of headroom while keeping the memory-limit gate's ~450 MB
      # output well above the limit (and under V8's max string length).
      AP_SANDBOX_MEMORY_LIMIT: '262144'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t activepieces-benchmark:local .

      - name: Start stack
        run: |
          APP_REPLICAS=1 \
          WORKER_REPLICAS=1 \
            docker compose -f benchmark/docker-compose.yml up -d
          echo "Waiting for containers to start..."
          sleep 5
          docker compose -f benchmark/docker-compose.yml ps

      - name: Provision project, connection, and API key
        run: |
          benchmark/setup.sh > "$RUNNER_TEMP/bench.env"
          echo "::add-mask::$(grep '^BENCH_API_KEY=' "$RUNNER_TEMP/bench.env" | cut -d= -f2-)"
          cat "$RUNNER_TEMP/bench.env" >> "$GITHUB_ENV"

      - name: Run smoke test
        run: smoke-test/verify.sh

      - name: Run memory stability test
        run: smoke-test/verify-memory.sh

      # Memory-limit detection gate: a Text Helper execute whose output blows the engine heap
      # must come back as a clean SANDBOX_MEMORY_ISSUE error, and the app must keep serving.
      - name: Run memory-limit smoke test
        run: smoke-test/verify-memory-limit.sh

      # Not gated here:
      # - Filesystem isolation (SANDBOX_PROCESS) and pause/resume (delay piece): /v1/execute
      #   runs only registered piece actions — no user code steps to probe the sandbox with,
      #   and no waitpoints to resume.
      # - S3 file storage: only flow bundles and engine-written run/step files go to S3, and
      #   the headless API writes neither.
      # - Throughput: covered by the baseline-backed gate in benchmark/gate (benchmark.yml),
      #   since shared runners are too noisy for a fixed req/s floor.

      - name: Show app logs on failure
        if: failure()
        run: docker compose -f benchmark/docker-compose.yml logs --tail=200 app

      - name: Show worker logs on failure
        if: failure()
        run: docker compose -f benchmark/docker-compose.yml logs --tail=200 worker

      - name: Show nginx logs on failure
        if: failure()
        run: docker compose -f benchmark/docker-compose.yml logs --tail=200 nginx

      - name: Teardown
        if: always()
        run: docker compose -f benchmark/docker-compose.yml down -v
