services:
  proxy:
    image: nginx:1.30.5-alpine
    container_name: inboxfm-proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '8080:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/_gateway/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - inboxfm-connect
  app:
    image: inboxfm-connect:local
    container_name: inboxfm-connect-app
    restart: unless-stopped
    expose:
      - '80'
    depends_on:
      - postgres
      - redis
    healthcheck:
      # The app image ships curl, not wget: a wget probe exits 127, so the app
      # never turns healthy and `condition: service_healthy` blocks the proxy forever.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/api/v1/flags >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    env_file: .env
    environment:
      - AP_CONTAINER_TYPE=APP
      # Pin the listen port: the image defaults AP_PORT to 80, but env_file may
      # override it, which would desynchronise from `expose` and the nginx
      # upstream `app:80` and 502 every proxied request.
      - AP_PORT=80
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - inboxfm-connect
    build:
      context: .
      dockerfile: Dockerfile
      target: run
  flowscript:
    image: inboxfm-flowscript:local
    container_name: inboxfm-flowscript
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
    expose:
      - '8081'
    environment:
      - FLOWSCRIPT_HOST=0.0.0.0
      - FLOWSCRIPT_PORT=8081
      - FLOWSCRIPT_LOG_LEVEL=info
      - AP_POSTGRES_HOST=postgres
      - AP_POSTGRES_PORT=5432
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - inboxfm-connect
    build:
      context: ./services/flowscript
      dockerfile: Dockerfile
  worker:
    image: inboxfm-connect:local
    # container_name is incompatible with deploy.replicas (a fixed name cannot
    # be shared by >1 replica); CI's compose validator rejects the combo (issue #398)
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    environment:
      - AP_CONTAINER_TYPE=WORKER
    deploy:
      replicas: 5
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - inboxfm-connect
  postgres:
    image: 'pgvector/pgvector:0.8.0-pg14'
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    environment:
      - 'POSTGRES_DB=${AP_POSTGRES_DATABASE}'
      - 'POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${AP_POSTGRES_USERNAME}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inboxfm-connect
  redis:
    image: 'redis:7.0.7'
    container_name: redis
    restart: unless-stopped
    volumes:
      - 'redis_data:/data'
    networks:
      - inboxfm-connect
volumes:
  postgres_data:
  redis_data:
networks:
  inboxfm-connect: