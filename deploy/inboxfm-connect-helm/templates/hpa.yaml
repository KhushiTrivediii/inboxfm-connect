{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "inboxfm-connect.fullname" . }}
  labels:
    {{- include "inboxfm-connect.labels" . | nindent 4 }}
spec:
  # The chart renders an Argo Rollout by default, or a StatefulSet when
  # workloadType=statefulset (see templates/deployment.yaml). The target must
  # reference the kind/apiVersion actually rendered, otherwise the HPA points
  # at a workload that does not exist and never scales.
  scaleTargetRef:
    {{- if eq (.Values.workloadType | default "rollout") "statefulset" }}
    apiVersion: apps/v1
    kind: StatefulSet
    {{- else }}
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    {{- end }}
    name: {{ include "inboxfm-connect.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
