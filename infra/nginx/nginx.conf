events {}

http {
    # Never advertise the Nginx version in error pages or response headers.
    server_tokens off;

    # Map the Upgrade request header to the Connection header value used by the upstream.
    # Blank Upgrade (normal HTTP) → "close"; anything else (WebSocket, SSE upgrade) → "upgrade".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream inboxfm_app {
        server app:80;
    }

    server {
        listen 80;
        server_name _;

        # Allow up to 50 MB request bodies (flow attachments, custom piece archives).
        client_max_body_size 50m;

        # Lightweight proxy liveness probe — never hits the app.
        location = /_gateway/health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://inboxfm_app;
            proxy_http_version 1.1;

            # Preserve the full Host including port so Fastify-generated redirects
            # and absolute URLs point at the correct public address (e.g. :8080).
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $server_port;

            # WebSocket / HTTP upgrade support.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Disable buffering so Server-Sent Events (SSE) used by flow run log
            # streaming are forwarded to the client incrementally, not batched.
            proxy_buffering off;
            proxy_cache     off;

            # Allow long-running flow executions without timing out at the gateway.
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
